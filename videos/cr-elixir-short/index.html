<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat CY";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat CY";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212, U+FEFF;
      }
      :root {
        --ground-0: #070d2b;
        --ground-1: #13226b;
        --ink: #ffffff;
        --ink-dim: #aab6ea;
        --elixir: #e14bff;
        --elixir-deep: #8a1fd1;
        --gold: #ffc83a;
        --gold-deep: #ff8a00;
        --red: #ff4d63;
        --blue: #3fa9ff;
        --win: #41e58a;
        --font-display: "Montserrat CY", "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground-0);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 35%, var(--ground-1) 0%, var(--ground-0) 70%);
      }
      #bg-tiles {
        position: absolute;
        left: -900px;
        top: -900px;
        width: 2880px;
        height: 3720px;
        opacity: 0.16;
        background-image:
          repeating-linear-gradient(45deg, rgba(120, 150, 255, 0.5) 0 2px, transparent 2px 120px),
          repeating-linear-gradient(-45deg, rgba(120, 150, 255, 0.5) 0 2px, transparent 2px 120px);
      }
      #bg-glow {
        position: absolute;
        left: 140px;
        top: 360px;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(225, 75, 255, 0.28) 0%, rgba(225, 75, 255, 0) 65%);
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(90% 70% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      /* shared card + elixir pieces, used by the trade scenes */
      .card {
        position: absolute;
        width: 250px;
        height: 320px;
        border-radius: 30px;
        background: linear-gradient(180deg, #2c3d8f 0%, #17205a 100%);
        border: 7px solid var(--card-edge, var(--blue));
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.45),
          inset 0 3px 0 rgba(255, 255, 255, 0.18);
      }
      .card--red {
        --card-edge: var(--red);
        background: linear-gradient(180deg, #5a2350 0%, #2a0f2e 100%);
      }
      .card svg.art {
        position: absolute;
        left: 25px;
        top: 34px;
        width: 186px;
        height: 186px;
      }
      .card .card-name {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        font-weight: 800;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .drop {
        position: absolute;
        width: 92px;
        height: 112px;
      }
      .drop svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .drop span {
        position: absolute;
        left: 0;
        right: 0;
        top: 40px;
        text-align: center;
        font-weight: 900;
        font-size: 52px;
        line-height: 1;
        color: #fff;
        text-shadow: 0 3px 0 rgba(60, 0, 90, 0.8);
      }
      .scene-host,
      .caption-host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="37.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="37.2" data-track-index="0">
        <div id="bg-tiles"></div>
        <div id="bg-glow"></div>
        <div id="bg-vignette"></div>
      </div>

      <div id="hook" class="scene-host" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="money" class="scene-host" data-composition-id="money" data-composition-src="compositions/money.html" data-start="5" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="trade1" class="scene-host" data-composition-id="trade1" data-composition-src="compositions/trade1.html" data-start="9.7" data-duration="7.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="trade2" class="scene-host" data-composition-id="trade2" data-composition-src="compositions/trade2.html" data-start="17.4" data-duration="5.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="lead" class="scene-host" data-composition-id="lead" data-composition-src="compositions/lead.html" data-start="23.2" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="push" class="scene-host" data-composition-id="push" data-composition-src="compositions/push.html" data-start="28.2" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="outro" class="scene-host" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="31.7" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="captions" class="caption-host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="37.2" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>

      <!-- voiceover -->
      <audio id="vo-1" src="assets/vo/s1.mp3" data-start="0" data-duration="5.00" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-2" src="assets/vo/s2.mp3" data-start="5" data-duration="4.70" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-3" src="assets/vo/s3.mp3" data-start="9.7" data-duration="7.70" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-4" src="assets/vo/s4.mp3" data-start="17.4" data-duration="5.80" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-5" src="assets/vo/s5.mp3" data-start="23.2" data-duration="5.00" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-6" src="assets/vo/s6.mp3" data-start="28.2" data-duration="3.50" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-7" src="assets/vo/s7.mp3" data-start="31.7" data-duration="5.50" data-track-index="3" data-volume="1"></audio>

      <!-- sound effects: start = picture time + 1 frame - file peak -->
      <audio id="sfx-strike" src="assets/sfx/whoosh-short.mp3" data-start="1.961" data-duration="0.575" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-math" src="assets/sfx/impact-bass-1.mp3" data-start="3.86" data-duration="2.116" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-cut2" src="assets/sfx/whoosh.mp3" data-start="4.671" data-duration="0.575" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-deal" src="assets/sfx/pop.mp3" data-start="8.723" data-duration="0.720" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-cut3" src="assets/sfx/whoosh-short.mp3" data-start="9.371" data-duration="0.575" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-cost1" src="assets/sfx/pop.mp3" data-start="11.693" data-duration="0.720" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-cost2" src="assets/sfx/pop.mp3" data-start="14.253" data-duration="0.720" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-hit1" src="assets/sfx/impact-bass-1.mp3" data-start="14.98" data-duration="2.116" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-win1" src="assets/sfx/sparkle.mp3" data-start="15.546" data-duration="1.802" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-cut4" src="assets/sfx/whoosh.mp3" data-start="17.071" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-cost3" src="assets/sfx/pop.mp3" data-start="18.463" data-duration="0.720" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-cost4" src="assets/sfx/pop.mp3" data-start="20.253" data-duration="0.720" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-hit2" src="assets/sfx/impact-bass-1.mp3" data-start="21.08" data-duration="2.116" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-win2" src="assets/sfx/sparkle.mp3" data-start="22.036" data-duration="1.802" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-cut5" src="assets/sfx/whoosh-short.mp3" data-start="22.871" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-gap" src="assets/sfx/ping.mp3" data-start="24.149" data-duration="1.320" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-stamp" src="assets/sfx/impact-bass-1.mp3" data-start="27.26" data-duration="2.116" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-push" src="assets/sfx/impact-bass-1.mp3" data-start="29.17" data-duration="2.116" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-cut7" src="assets/sfx/whoosh.mp3" data-start="31.271" data-duration="0.575" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-save" src="assets/sfx/pop.mp3" data-start="31.813" data-duration="0.720" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-bubble" src="assets/sfx/pop.mp3" data-start="34.183" data-duration="0.720" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="25.77" data-duration="3.5" data-track-index="6" data-volume="0.25" data-fade-out="0.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // slow orbit of the arena tiles: constant, linear by intent
      tl.fromTo("#bg-tiles", { rotation: 0 }, { rotation: 18, duration: 37.2, ease: "none" }, 0);
      tl.fromTo("#bg-glow", { scale: 0.9 }, { scale: 1.15, duration: 37.2, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
